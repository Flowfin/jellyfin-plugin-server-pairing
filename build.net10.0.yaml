---
# The manifest for the 12.0 server line, which runs on net10.0. The 10.11 line
# has its own manifest in build.yaml. Everything except framework and targetAbi
# is the same plugin, and the two files repeat it because the packaging tool
# reads one manifest per package and has no way to include another.
name: "Server Pairing"
guid: "130cc961-461b-49fd-8a3e-f9eb46db0716"
imageUrl: "https://raw.githubusercontent.com/Flowfin/jellyfin-plugin-server-pairing/master/img/logo.png"
version: "0.1.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Pairs this Jellyfin server with a second one, so plugins on both sides can work across the pair."
description: >
  Server Pairing links two Jellyfin servers under a credential of its own, which
  is accepted by this plugin's pairing surface and by nothing else on either
  server. An administrator on each side confirms the pairing by hand, and the
  plugin holds the resulting key material and the user mapping that goes with
  it.

  It carries no syncing of its own. Watch state, playlists and everything else
  that might move between two servers belong to the plugins that build on this
  one. A pairing is between two servers under one operator, and pairing to
  anything that is not a Jellyfin server is out of scope.
category: "Administration"
owner: "Flowfin"
artifacts:
- "Jellyfin.Plugin.ServerPairing.dll"
changelog: >
  The first release. A server that installs it answers on the six pairing paths
  the specification fixes and refuses every request that reaches them. Nothing
  verifies yet, because a server has no key to verify against: the check that reads
  an arriving request looks the pairing up in this server's key store, and nothing
  puts a key there, since there is no page and no endpoint an administrator can open
  an enrolment from. Two servers cannot be paired with this version.
