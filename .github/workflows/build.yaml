name: '🏗️ Build Plugin'

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny at the workflow level and grant on the job, so what this call runs with
# is written here rather than inherited from the repository's default workflow
# permission. That default is a repository setting no file in this tree can pin,
# and widening it would widen this call without any diff to review.
permissions: {}

jobs:
  call:
    # A reusable-workflow call carries one permission set into every job of the
    # called workflow, so this is the scope for all of it. The called job checks
    # this repository out, builds it, and uploads the result with
    # actions/upload-artifact, which authenticates to the artifact service with
    # the runtime token rather than with GITHUB_TOKEN. Read is the whole need.
    permissions:
      contents: read # check out the repository being built
    # Pinned to a commit rather than to a branch. The ref belongs to another
    # organisation, and a branch is whatever it points at when the run starts,
    # so a change there reaches this repository's build with no diff here. The
    # trailing comment names the branch the commit was taken from, so moving to
    # a later one is a line somebody reviews.
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # master
