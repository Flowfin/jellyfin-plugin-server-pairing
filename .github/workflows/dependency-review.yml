name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job. A required status check matches the literal
  # check-run name, which defaults to the job id ("dependency-review") when no
  # `name:` is set, so adding one here renames the check run under anything that
  # relies on the context. Change it deliberately or not at all.
  #
  # This job's context is required on the default branch today, so a red run
  # blocks a merge. The one ruleset that reaches `master` here is named `gate`,
  # and what it requires is a repository setting rather than anything in this
  # tree, so it is read rather than assumed and no copy of it is kept beside the
  # reading. This comment said the context was not required until that setting
  # moved:
  #
  #     gh api repos/Flowfin/jellyfin-plugin-server-pairing/rulesets/20464076 \
  #       --jq '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context]'
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
