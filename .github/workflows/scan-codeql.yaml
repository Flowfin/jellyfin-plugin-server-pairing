# Code scanning over this plugin's own C#.
#
# This workflow used to call jellyfin/jellyfin-meta-plugins/scan-codeql.yaml.
# That analysis ran, but every setting on it lives in a repository nobody
# here can change: the query pack, the severity threshold, and above all the
# path filter. Its findings therefore included the generated sources under
# obj/ and bin/, files that are not in this tree and that nobody reading the
# report can edit. Writing the workflow here puts the configuration beside
# the code it reads. The build and test calls have the same shape and are
# recorded as #62; they are separate work.
#
# READING THE OPEN SET IS NOT THE OBVIOUS COMMAND. An alert's `state` is one
# value for the alert across every ref it has ever been seen on, so filtering
# the listing by `ref=refs/heads/master&state=open` returns alerts whose
# instance on master is `fixed` and which are held open by a pull-request ref
# nobody will push to again. Four of the nine that listing returned on
# 2026-09-01 were of that kind. What answers the question is the commit CodeQL
# has actually analysed:
#
#     analysed=$(gh api "repos/Flowfin/jellyfin-plugin-server-pairing/code-scanning/analyses?ref=refs/heads/master&tool_name=CodeQL&per_page=1" \
#       --jq '.[0].commit_sha')
#     [ "$analysed" = "$(git rev-parse origin/master)" ] \
#       || echo "NOT THE HEAD: CodeQL last judged $analysed"
#     gh api "repos/Flowfin/jellyfin-plugin-server-pairing/code-scanning/alerts?state=open&ref=refs/heads/master&per_page=100" \
#       --jq ".[] | select(.most_recent_instance.commit_sha == \"$analysed\") | \"\(.tool.name)\t\(.rule.id)\"" \
#       | sort | uniq -c
#
# THE HEAD IS NOT ALWAYS A COMMIT ANYTHING LOOKED AT, and that is why the
# selection is on the analysis rather than on `git rev-parse origin/master`. The
# push trigger below skips a documentation-only change, so after such a merge
# the head carries no analysis, a selection against it returns nothing, and an
# empty answer reads exactly like a clean one. It happened at `8e427cc`, the
# merge of #317, which changed one document: the selection returned nothing
# while `cs/linq/missed-where` was live at `bf125b5`, and #314 is where that
# instance was repaired. The line that compares the two commits is what makes an
# empty answer an answer rather than a silence, and it prints instead of
# refusing because a stale analysis is a fact about timing rather than a fault.
#
# It answers for the commit it selects and for nothing else, so a run of it says
# what that analysis holds rather than what has ever been reported.
#
# The push trigger skips documentation-only changes, because a push to master
# gates nothing and the baseline simply stays at the previous analysis. The
# pull request trigger is never filtered: a filter there does not make the
# check red, it stops the check reporting at all, so a documentation-only
# pull request would go out with no verdict on it. The filter for what the
# analysis READS sits at the init step below.
name: Code scanning

on:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [master]
  # A weekly run so a query pack that learns something new says so against a
  # tree nobody has touched, rather than waiting for the next change.
  schedule:
    - cron: "43 3 * * 4"
  workflow_dispatch:

# Nothing at workflow level; the job below asks for what it needs and no more.
permissions: {}

# A new push replaces the run under way. An analysis of a superseded tree says
# nothing about the branch as it now stands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    # This name is the check context. Changing it removes a context rather
    # than renaming one, so it is changed only together with whatever
    # requires it.
    name: Code scanning (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The upload of the analysis, which is the whole output of this job.
      security-events: write
      # What the uploader reads to find the workflow run it reports against.
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, so the token is not kept in .git/config.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both server lines the solution targets. global.json picks the
          # 10.0 SDK from these; the 9.0 install carries the targeting pack.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: csharp
          # The default pack finds security faults. This one adds the quality
          # queries beside them, which is what the other plugins run, and
          # comparing plugins is only meaningful if they run the same set.
          queries: +security-and-quality
          # Path filtering for the ANALYSIS. This block is the reason the
          # workflow lives here: the shared workflow it replaces has no way
          # to carry it. The generated sources under obj/ are not in the
          # tree, and nobody can change them.
          #
          # A rule is excluded here only where this repository judges the same
          # property itself and judges it more tightly. The reason sits beside
          # the exclusion rather than in a document, because a reader who wants
          # to know why an alert stopped arriving opens this file.
          #
          # cs/catch-of-all-exceptions: this plugin has four catches that take
          # every fault. Three are boundaries where a fault has to become the
          # same refusal every caller gets, and the fourth discards a
          # half-written temporary and rethrows. The rule reports the three
          # typed ones on every run, cannot read the pragma each of them
          # carries, and is a note in a report somebody has to open - it does
          # not see the fourth at all. CatchAllSiteTests in the
          # suite names each site with its reason and fails the build both ways:
          # a catch-all at a site the table does not name, and a declaration for
          # a site that no longer holds one. That is the same property with a
          # declaration and a verdict, so the note is turned off rather than
          # carried beside it. Nothing else in the build says it: jellyfin.ruleset
          # sets CA1031 to Info, which is why the pragmas at those sites suppress
          # a warning that is not raised.
          config: |
            paths-ignore:
              - "**/obj/**"
              - "**/bin/**"
            query-filters:
              - exclude:
                  id: cs/catch-of-all-exceptions

      - name: Build what is scanned
        # Built by name rather than by autobuild. Autobuild guesses, and a
        # guess that quietly compiles less than the tree holds is an analysis
        # of part of the source reported as an analysis of it. A build that
        # fails stops the job instead of producing an analysis of whatever
        # did compile.
        run: |
          set -euo pipefail
          dotnet restore Jellyfin.Plugin.ServerPairing.sln
          dotnet build Jellyfin.Plugin.ServerPairing.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:csharp"
