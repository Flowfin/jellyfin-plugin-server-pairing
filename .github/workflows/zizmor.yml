# Static analysis of the GitHub Actions workflows themselves (zizmor). The
# workflow YAML is release-critical attack surface: the one job in this tree that
# holds contents:write is the release job in publish.yaml, reached by pushing a
# release tag, so a workflow file is audited like any other code.
#
# The gate runs zizmor's regular persona at --min-severity=low: it fails the
# build on any actionable (low/medium/high/critical) security finding -
# template-injection, cache-poisoning, dangerous-triggers, excessive-permissions,
# unpinned-uses, etc. The same set is uploaded to the code-scanning tab where the
# token may write it, which is the condition on the upload step below. The
# regular persona is the one zizmor documents for CI ("high-signal, low-noise,
# actionable"). The pedantic persona is deliberately NOT used to gate: it adds
# low-severity hygiene findings (undocumented permissions, missing concurrency,
# pin-comment mismatches, unnamed jobs) that are stylistic, not security-blocking,
# and some are context-blind (it would demand run-cancelling concurrency on the
# release workflows, which must never be cancelled mid-publish). That backlog is
# not gated here and no issue on this repository holds it.
#
# What this gate does to a merge is read rather than written down here. This
# job's context is not in the required set today, so a red run reports and blocks
# nothing, and what is required is a repository setting rather than anything in
# this tree:
#
#     gh api repos/Flowfin/jellyfin-plugin-server-pairing/rulesets/20464076 \
#       --jq '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context]'
#
# What a workflow change is expected to carry, whether or not anything refuses
# it: actions SHA-pinned, checkout on persist-credentials:false, write
# permissions granted per job and never workflow-level, and no cache restored in
# a job that publishes a release.
name: Workflow Security Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ "**" ]

# Explicit deny-all at workflow level; the job below grants only what it needs.
permissions: {}

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete scan. This is an audit job, not a publish, so
# cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF into the code-scanning tab
      contents: read # checkout the workflows to scan
    env:
      ZIZMOR_VERSION: "1.26.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Audit workflows (SARIF for code scanning)
        # --no-build: install zizmor from its prebuilt wheel only, never executing a
        # source-dist build script. --strict-collection: fail closed if any workflow
        # fails to parse, so a malformed/tampered file cannot slip past the audit.
        # --format=sarif always exits 0; the gate step below is what fails the build.
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        # Only upload where the GITHUB_TOKEN can write security events: pushes to the
        # default branch and same-repo human pull requests. The default branch here is
        # master, which is what the push trigger above already names; a condition naming
        # a branch this repository does not have matches nothing, and the upload is dead
        # on every push for as long as it names one. Fork and Dependabot pull requests
        # run with a read-only token, so the upload is skipped there and the step below
        # still reds the job on findings. continue-on-error keeps that step independent
        # of the upload: a transient code-scanning upload failure must not skip
        # "Fail on actionable findings".
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail on actionable findings
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
