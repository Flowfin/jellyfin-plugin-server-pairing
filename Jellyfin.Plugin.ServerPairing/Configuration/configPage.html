<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Server Pairing</title>
</head>
<body>
    <div id="ServerPairingConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <div id="EnrolmentWindowState" class="fieldDescription" data-role="enrolment-window-state"></div>
                <form id="ServerPairingConfigForm">
                    <div class="selectContainer">
                        <label class="selectLabel" for="Options">Several Options</label>
                        <select is="emby-select" id="Options" name="Options" class="emby-select-withcolor emby-select">
                            <option id="optOneOption" value="OneOption">One Option</option>
                            <option id="optAnotherOption" value="AnotherOption">Another Option</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AnInteger">An Integer</label>
                        <input id="AnInteger" name="AnInteger" type="number" is="emby-input" min="0" />
                        <div class="fieldDescription">A Description</div>
                    </div>
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="TrueFalseSetting" name="TrueFalseCheckBox" type="checkbox" is="emby-checkbox" />
                            <span>A Checkbox</span>
                        </label>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="AString">A String</label>
                        <input id="AString" name="AString" type="text" is="emby-input" />
                        <div class="fieldDescription">Another Description</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
                <div id="MappingTables" data-role="mapping-tables"></div>
                <div id="Diagnostics" data-role="diagnostics"></div>
            </div>
        </div>
        <script type="text/javascript">
            var ServerPairingConfig = {
                pluginUniqueId: '130cc961-461b-49fd-8a3e-f9eb46db0716'
            };

            // While an enrolment window is open the plugin says so, because a window somebody
            // opened and forgot is the failure the enrolment bounds are there for. The answer
            // is read from the plugin's own endpoint on every pageshow rather than baked into
            // the served markup, so what is rendered is the state now and not the state when
            // the page was built.
            //
            // Every value out of that answer reaches the page through textContent. A pairing
            // identifier is this server's own and a timestamp is a timestamp, so neither is a
            // peer-controlled string today; the rule is that a value from an endpoint is text
            // and never markup, and it is written at the first value rather than at the first
            // hostile one.
            function renderEnrolmentWindows(open) {
                var line = document.querySelector('#EnrolmentWindowState');

                while (line.firstChild) {
                    line.removeChild(line.firstChild);
                }

                if (!open || open.length === 0) {
                    line.textContent = 'No enrolment window is open.';
                    return;
                }

                line.textContent = open.length === 1
                    ? 'An enrolment window is open. While it is open this server will answer the address it was opened against.'
                    : open.length + ' enrolment windows are open. While they are open this server will answer the addresses they were opened against.';

                var list = document.createElement('ul');

                open.forEach(function (window) {
                    var item = document.createElement('li');
                    item.textContent = window.pairingId + ' opened at ' + window.openedAt;
                    list.appendChild(item);
                });

                line.appendChild(list);
            }

            // The mapping table of every pairing this server holds a key for, and the one thing
            // an administrator can change here, which is removing a row from it.
            //
            // What the operator reads before removing is not written in this file. The sentence
            // lives in DestructiveWording and nowhere else, the suite refuses markup that carries
            // a copy, and the operator guide is held equal to the register. So the page asks the
            // plugin for the wording on every show and renders what it answered, in the same view
            // as the button and never in a tooltip, which is the rule issue #49 states for every
            // destructive action. Every value out of every answer reaches the page through
            // textContent, for the reason written above renderEnrolmentWindows: a peer's display
            // name is in this table and is a peer-controlled string.
            function clearChildren(element) {
                while (element.firstChild) {
                    element.removeChild(element.firstChild);
                }
            }

            function paragraph(text) {
                var line = document.createElement('p');
                line.className = 'fieldDescription';
                line.textContent = text;
                return line;
            }

            function cell(row, text) {
                var column = document.createElement('td');
                column.textContent = text;
                row.appendChild(column);
                return column;
            }

            function describeFailure(failure) {
                var status = failure && failure.status ? 'status ' + failure.status : 'no answer';

                if (failure && typeof failure.json === 'function') {
                    return failure.json().then(function (body) {
                        return body && body.problem ? body.problem : status;
                    }, function () {
                        return status;
                    });
                }

                return Promise.resolve(status);
            }

            function mappingsPath(pairingId) {
                return 'ServerPairing/Administration/pairings/' + encodeURIComponent(pairingId) + '/mappings';
            }

            function removeMapping(section, pairingId, localUserId, wording) {
                return ApiClient.ajax({
                    type: 'DELETE',
                    url: ApiClient.getUrl(mappingsPath(pairingId) + '/' + encodeURIComponent(localUserId))
                }).then(function () {
                    return loadMappingTable(section, pairingId, wording);
                }, function (failure) {
                    return describeFailure(failure).then(function (reason) {
                        section.appendChild(paragraph('The mapping was not removed (' + reason + ').'));
                    });
                });
            }

            function renderMappingTable(section, pairingId, table, wording) {
                clearChildren(section);

                var heading = document.createElement('h3');
                heading.textContent = 'Pairing ' + pairingId;
                section.appendChild(heading);

                if (table.mappings.length === 0) {
                    section.appendChild(paragraph('No user is mapped under this pairing.'));
                } else {
                    // The consequence of removing is in the same view as every remove button,
                    // read from the register rather than written here.
                    section.appendChild(paragraph(wording.destructive.RemoveMapping));

                    var grid = document.createElement('table');
                    var head = document.createElement('tr');
                    cell(head, 'This server');
                    cell(head, 'The other server');
                    cell(head, '');
                    grid.appendChild(head);

                    table.mappings.forEach(function (mapping) {
                        var row = document.createElement('tr');
                        var local = cell(row, mapping.localUserShownAs);

                        // A mapping whose user this server no longer has is reported by the
                        // listing, by a flag rather than by an empty name, and is said here in
                        // words rather than left as an identifier an operator has to recognise
                        // as one. It is kept and offered for removal, never repaired by guessing.
                        if (mapping.localUserExists === false) {
                            local.appendChild(paragraph('This server no longer has this user. The mapping is kept and reported so it can be removed here rather than repaired by guessing.'));
                        }

                        cell(row, mapping.peerUserShownAs);

                        var remove = document.createElement('button');
                        remove.type = 'button';
                        remove.className = 'raised emby-button';
                        remove.textContent = 'Remove';
                        remove.addEventListener('click', function () {
                            removeMapping(section, pairingId, mapping.localUserId, wording);
                        });
                        cell(row, '').appendChild(remove);

                        grid.appendChild(row);
                    });

                    section.appendChild(grid);
                }

                if (table.unmappedLocalUsers.length > 0) {
                    section.appendChild(paragraph('Not mapped under this pairing, so nothing moves for them:'));

                    var list = document.createElement('ul');

                    table.unmappedLocalUsers.forEach(function (user) {
                        var item = document.createElement('li');
                        item.textContent = user.localUserName;
                        list.appendChild(item);
                    });

                    section.appendChild(list);
                }
            }

            function loadMappingTable(section, pairingId, wording) {
                return ApiClient.getJSON(ApiClient.getUrl(mappingsPath(pairingId))).then(function (table) {
                    renderMappingTable(section, pairingId, table, wording);
                }, function (failure) {
                    return describeFailure(failure).then(function (reason) {
                        clearChildren(section);
                        section.appendChild(paragraph('Pairing ' + pairingId + ': the mapping table could not be read (' + reason + ').'));
                    });
                });
            }

            function renderMappingTables(pairings, wording) {
                var host = document.querySelector('#MappingTables');

                clearChildren(host);

                if (!pairings || pairings.length === 0) {
                    host.appendChild(paragraph('No mapping table is held, because this server holds no pairing.'));
                    return;
                }

                pairings.forEach(function (pairingId) {
                    var section = document.createElement('div');
                    host.appendChild(section);
                    loadMappingTable(section, pairingId, wording);
                });
            }

            function loadMappingTables() {
                return Promise.all([
                    ApiClient.getJSON(ApiClient.getUrl('ServerPairing/Administration/wording')),
                    ApiClient.getJSON(ApiClient.getUrl('ServerPairing/Administration/pairings'))
                ]).then(function (answers) {
                    renderMappingTables(answers[1], answers[0]);
                }, function (failure) {
                    return describeFailure(failure).then(function (reason) {
                        var host = document.querySelector('#MappingTables');
                        clearChildren(host);
                        host.appendChild(paragraph('The mapping tables could not be read (' + reason + ').'));
                    });
                });
            }

            // The diagnostics payload, rendered so an operator reads it here rather than calling
            // the endpoint by hand, which is the fourth condition of issue #51. The members are
            // walked rather than named, because the payload gains a member whenever something
            // starts producing one and a page naming members would silently omit the next; what
            // is rendered is every member the plugin answered with, numbers and maps of numbers.
            // The same payload is offered verbatim for pasting into a support thread, through
            // textContent like everything else on this page.
            function renderDiagnosticsMember(list, name, value) {
                var item = document.createElement('li');

                if (value !== null && typeof value === 'object') {
                    item.textContent = name;
                    var inner = document.createElement('ul');
                    Object.keys(value).forEach(function (key) {
                        renderDiagnosticsMember(inner, key, value[key]);
                    });
                    item.appendChild(inner);
                } else {
                    item.textContent = name + ': ' + value;
                }

                list.appendChild(item);
            }

            function renderDiagnostics(payload) {
                var host = document.querySelector('#Diagnostics');

                clearChildren(host);

                var heading = document.createElement('h3');
                heading.textContent = 'Diagnostics';
                host.appendChild(heading);

                host.appendChild(paragraph('What the pairing plane has refused since this server started, by code and by cause, and how many identifiers the arrival limit is counting. It names no pairing, no address and no person, so it can be pasted into a support thread as it is.'));

                var list = document.createElement('ul');
                Object.keys(payload).forEach(function (name) {
                    renderDiagnosticsMember(list, name, payload[name]);
                });
                host.appendChild(list);

                var verbatim = document.createElement('pre');
                verbatim.textContent = JSON.stringify(payload, null, 2);
                host.appendChild(verbatim);
            }

            function loadDiagnostics() {
                return ApiClient.getJSON(ApiClient.getUrl('ServerPairing/Administration/diagnostics')).then(renderDiagnostics, function (failure) {
                    return describeFailure(failure).then(function (reason) {
                        var host = document.querySelector('#Diagnostics');
                        clearChildren(host);
                        host.appendChild(paragraph('The diagnostics could not be read (' + reason + ').'));
                    });
                });
            }

            document.querySelector('#ServerPairingConfigPage')
                .addEventListener('pageshow', function() {
                    ApiClient.getJSON(ApiClient.getUrl('ServerPairing/Administration/windows'))
                        .then(renderEnrolmentWindows);

                    loadMappingTables();
                    loadDiagnostics();

                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(ServerPairingConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#Options').value = config.Options;
                        document.querySelector('#AnInteger').value = config.AnInteger;
                        document.querySelector('#TrueFalseSetting').checked = config.TrueFalseSetting;
                        document.querySelector('#AString').value = config.AString;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#ServerPairingConfigForm')
                .addEventListener('submit', function(e) {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(ServerPairingConfig.pluginUniqueId).then(function (config) {
                    config.Options = document.querySelector('#Options').value;
                    config.AnInteger = document.querySelector('#AnInteger').value;
                    config.TrueFalseSetting = document.querySelector('#TrueFalseSetting').checked;
                    config.AString = document.querySelector('#AString').value;
                    ApiClient.updatePluginConfiguration(ServerPairingConfig.pluginUniqueId, config).then(function (result) {
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });

                e.preventDefault();
                return false;
            });
        </script>
    </div>
</body>
</html>
